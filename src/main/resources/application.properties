spring.config.import=optional:secrets.properties

# ---------- MySQL (настройки не меняем) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/appshop
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# open-in-view=false: без этой настройки lazy-загрузки «текут» через HTTP-поток запроса
spring.jpa.open-in-view=false

# ---------- Загрузка файлов (фото футболки) ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# ---------- JWT ----------
# Секрет ОБЯЗАТЕЛЬНО переопределить в secrets.properties или переменной окружения JWT_SECRET.
# Для HS512 ключ должен быть не короче 64 байт.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please-0123456789-abcdefghijklmnop-QRSTUVWXYZ}
jwt.access-token-ttl=PT15M
jwt.refresh-token-ttl=P7D
jwt.issuer=appshop

# ---------- CORS (фронтенд на Vite) ----------
# ОДИНОЧНЫЙ ключ: в .properties повторяющийся ключ не «складывается», а побеждает
# последний — легко запутаться, какие адреса реально открыты.
# В бою переопределяют без правки файла: APP_CORS_ALLOWEDORIGINS=https://shop.example.com
# Адрес LAN (192.168.0.11) — только для отладки со смартфона рядом с этим же Wi-Fi.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://192.168.0.11:5173,https://8ddd0d2744236cfd-87-252-227-61.serveousercontent.com

# ---------- Администратор, создаваемый при старте ----------
# НУЖНО ТОЛЬКО для локальной разработки, чтобы сразу получить доступ в админку.
# В боевом контуре этот аккаунт захардкожен быть не должен: переопределите через
# APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD (или выключите, закомментировав строки) и
# заведите администратора вручную с паролем из менеджера паролей.
app.admin.email=${APP_ADMIN_EMAIL:admin@clothes.shop}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
# app.admin.firstName=Admin
# app.admin.lastName=Shop

# ---------- SMTP: подтверждение регистрации по e-mail (PIN-код) ----------
# Значения задаются в secrets.properties (MAIL_HOST/MAIL_USERNAME/...) или переменными окружения.
# Пока MAIL_HOST пустой, Spring Boot НЕ создаёт JavaMailSender, и приложение печатает
# PIN-код в лог консоли (см. services/EmailSender.java) — удобно для локального теста.
# Пример для Gmail: host=smtp.gmail.com, port=587, username=ваш@gmail.com,
# password=пароль приложения (не пароль от аккаунта!).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=clothesshop1453@gmail.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# От кого приходит письмо и как живёт подтверждение аккаунта
app.mail.from=${MAIL_FROM:noreply@clothes.shop}
app.verification.enabled=${VERIFICATION_ENABLED:true}
app.verification.code-ttl=PT24H

# ---------- Периодическая чистка просроченных refresh-токенов ----------
app.refresh-token.cleanup-delay-ms=86400000
app.refresh-token.initial-delay-ms=60000

# ---------- Ограничение частоты обращений (защита от перебора и «ботов») ----------
# Считаем запросы по адресу посетителя в памяти процесса (см. security/InMemoryIpRateLimiter).
# Логика в двух словах: окно в одну минуту + «блокировка» на block-minutes, если лимит выбран.
#   - публичные /api/** (каталог, карточки) — 80 запросов в минуту на адрес;
#   - /api/auth/login и /api/auth/register — 5 запросов в минуту (дальше ждём минуту);
#   - счётчики разделены, поэтому серфинг по каталогу не «съедает» лимит входа.
# Превышение = HTTP 429 Too Many Requests + заголовок Retry-After.
# Важно: /api/images/** под лимит НЕ попадает — один каталог тянет десятки картинок,
# и живой посетитель получал бы 429 просто листая товары.
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
security.rate-limit.public-requests-per-minute=${RATE_LIMIT_PUBLIC_PER_MIN:80}
security.rate-limit.auth-requests-per-minute=${RATE_LIMIT_AUTH_PER_MIN:5}
security.rate-limit.block-minutes=${RATE_LIMIT_BLOCK_MIN:1}
security.rate-limit.sweep-minutes=${RATE_LIMIT_SWEEP_MIN:10}
# Ставим true ТОЛЬКО если приложение честно стоит за обратным прокси (nginx/Cloudflare):
# иначе заголовок X-Forwarded-For подделывает сам посетитель, и лимит обходится одной строчкой
# в заголовках запроса.
security.rate-limit.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}

# ---------- Капча Cloudflare Turnstile на регистрации ----------
# Ключи берём из переменных окружения; в репозиторий секреты не коммитим.
# Если TURNSTILE_SECRET_KEY не задан — капча выключена (локальная разработка и CI работают
# без внешних сервисов). Как только ключ появился, сервер начинает проверять токен сам,
# а фронтенд сам (по /api/auth/captcha-status) начинает показывать виджет.
captcha.turnstile.site-key=${TURNSTILE_SITE_KEY:}
captcha.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
captcha.turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
captcha.turnstile.timeout-ms=3000
# Сколько аккаунтов можно завести с одного адреса и за какой срок
captcha.turnstile.registrations-per-ip-per-day=${REGISTRATIONS_PER_IP_PER_DAY:3}
captcha.turnstile.registrations-window-hours=24

# ---------- Обезличенная аналитика (воронка продаж) ----------
# События пишутся в таблицу tracking_events только когда посетитель согласился
# на обработку данных в cookie-баннере (фронтенд) и/или прислал X-Visitor-Id.
# Личных данных там нет: обезличенный ключ посетителя + id товара + дата.
app.analytics.top-size=${ANALYTICS_TOP_SIZE:5}

# ---------- OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Errors ----------
# Возвращать сообщение об ошибке в JSON, а не в виде страницы ошибки сервлет-контейнера
server.error.include-message=always
server.error.include-stacktrace=never

logging.level.org.springframework.security=INFO
